# CD: staged release workflow with overridable deploy hooks.
name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Validate release gate
        run: bun run preflight
        env:
          # sqlx compile-time checks need a URL shape; no live DB required for demo app skips
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
      # The web and docs apps deploy through their connected Vercel projects; the API uses Render.
      - name: Deploy API to staging
        env:
          render_deploy_hook_url: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          : "${render_deploy_hook_url:?Set RENDER_STAGING_DEPLOY_HOOK_URL in the staging environment}"
          deploy_url="$render_deploy_hook_url"
          if [[ "$deploy_url" == *\?* ]]; then
            deploy_url="${deploy_url}&ref=${GITHUB_SHA}"
          else
            deploy_url="${deploy_url}?ref=${GITHUB_SHA}"
          fi
          curl --fail --silent --show-error "$deploy_url" >/dev/null
      - name: Wait for staging health
        env:
          healthcheck_url: ${{ secrets.STAGING_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          : "${healthcheck_url:?Set STAGING_HEALTHCHECK_URL in the staging environment}"
          for _ in {1..60}; do
            if curl --fail --silent --show-error "$healthcheck_url" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "staging health check did not pass within 10 minutes" >&2
          exit 1

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      # The web and docs apps deploy through their connected Vercel projects; the API uses Render.
      - name: Deploy API to production
        env:
          render_deploy_hook_url: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          : "${render_deploy_hook_url:?Set RENDER_PRODUCTION_DEPLOY_HOOK_URL in the production environment}"
          deploy_url="$render_deploy_hook_url"
          if [[ "$deploy_url" == *\?* ]]; then
            deploy_url="${deploy_url}&ref=${GITHUB_SHA}"
          else
            deploy_url="${deploy_url}?ref=${GITHUB_SHA}"
          fi
          curl --fail --silent --show-error "$deploy_url" >/dev/null
      - name: Wait for production health
        env:
          healthcheck_url: ${{ secrets.PROD_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          : "${healthcheck_url:?Set PROD_HEALTHCHECK_URL in the production environment}"
          for _ in {1..60}; do
            if curl --fail --silent --show-error "$healthcheck_url" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "production health check did not pass within 10 minutes" >&2
          exit 1
